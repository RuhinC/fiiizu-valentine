

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 400px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 30px;
    }

    button {
      font-size: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
      transition: all 0.3s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #adb5bd;
      color: white;
      position: absolute;
    }

    #message {
      margin-top: 20px;
      color: #ff4d6d;
      font-weight: bold;
      min-height: 24px;
    }

    .celebrate {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .celebrate h2 {
      color: #ff4d6d;
    }

    .celebrate img {
      width: 250px;
      margin-top: 20px;
      border-radius: 15px;
    }
  </style>
</head>
<body>

  <div class="card" id="questionCard">
    <h1>Fiiiizzuuu 💖<br>Will you be my Valentine?</h1>
    <button id="yes">Yes 💘</button>
    <button id="no">No 💔</button>
    <div id="message"></div>
  </div>

  <div class="card celebrate" id="celebrateCard">
    <h2>YAYYYYY 💃🕺</h2>
    <p>You’re officially my Valentine 💕</p>
    <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" alt="Dancing Monkey">
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("message");

    const messages = [
      "Heyyy you can’t escape 😏",
      "Nice try 😂",
      "Just say yes already 💕",
      "Why are you running? 🏃‍♂️",
      "Destiny says YES 💘"
    ];

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      yesBtn.style.transform = "scale(1.2)";

      msg.textContent = messages[Math.floor(Math.random() * messages.length)];
    });

    yesBtn.addEventListener("click", () => {
      document.getElementById("questionCard").style.display = "none";
      document.getElementById("celebrateCard").style.display = "flex";
    });
  </script>

</body>
</html>
